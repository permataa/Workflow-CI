name: ML Project CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas

      - name: Train model
        run: |
          cd MLProject
          python modelling.py --data_path personality.csv --n_estimators 100 --max_depth 10
          cd ..

      - name: Find model path
        id: model_path
        run: |
          MODEL_PATH=$(find MLProject/mlruns -type d -name "model" | head -n 1)
          echo "path=$MODEL_PATH" >> $GITHUB_OUTPUT
          echo "Found model at: $MODEL_PATH"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (v2)
        run: |
          mlflow models build-docker \
            -m "${{ steps.model_path.outputs.path }}" \
            -n ${{ secrets.DOCKER_USERNAME }}/personality-classification:v2

      - name: Push to Docker Hub (v2)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/personality-classification:v2
